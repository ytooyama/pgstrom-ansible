---
- name: Setup the PG-Strom to Rocky Linux 9.x / AlmaLinux 9.x
  hosts: home
  become: true
  tasks:
   - name: Upgrade all packages
     ansible.builtin.dnf:
      name: "*"
      state: latest

   - name: Reboot a machine that might have lots of updates to apply
     ansible.builtin.reboot:
      reboot_timeout: 180
   
   - name: Install the 'Development tools' package group.
     ansible.builtin.dnf:
      name: '@Development tools'
      state: present

   - name: Install the perl-IPC-Run package from the powertools repo
     ansible.builtin.dnf:
      name: perl-IPC-Run
      enablerepo: crb
      state: present

   - name: Install the kernel, kernel-dev and headers.
     ansible.builtin.dnf:
      name:
       - kernel-core >= 5.14.0-503
       - kernel-devel >= 5.14.0-503
       - kernel-headers >= 5.14.0-503
      state: present

   - name: Install the grubby.
     ansible.builtin.dnf:
      name:
       - grubby
      state: present

   - name: Config the GRUB.
     ansible.builtin.shell:
      cmd: "grubby --update-kernel=ALL --args='nouveau.modeset=0 rd.driver.blacklist=nouveau video=vesa:off'"

   - name: Install the epel-release rpm from a remote repo
     ansible.builtin.dnf:
      name: 'https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm'
      state: present
      disable_gpg_check: true

   - name: Install the HeteroDB Software Distribution Center rpm from a remote repo.
     ansible.builtin.dnf:
      name: "https://heterodb.github.io/swdc/yum/rhel9-noarch/heterodb-swdc-1.3-1.el9.noarch.rpm"
      state: present
      disable_gpg_check: true

   - name: Enable the CUDA repo
     ansible.builtin.shell:
      cmd: "sudo dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/cuda-rhel9.repo"

   - name: Install the CUDA Drivers.
     ansible.builtin.shell:
      cmd: "dnf -y module install nvidia-driver:open-dkms"

   - name: Reboot a machine that might have lots of updates to apply
     ansible.builtin.reboot:
      reboot_timeout: 180

   - name: Install the CUDA.
     ansible.builtin.dnf:
      name:
       - cuda-toolkit-12-9
      state: present
      update_cache: true
      disable_gpg_check: true
     async: 3600
     poll: 30
     register: cuda_install 

   - name: Check CUDA installation progress
     ansible.builtin.debug:
      var: cuda_install

   - name: Install the PostgreSQL package repos rpm from a remote repo.
     ansible.builtin.dnf:
      name: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm"
      state: present
      disable_gpg_check: true

   - name: Disable the PostgreSQL Module Packages.
     ansible.builtin.shell:
      cmd: "dnf -y module disable postgresql"

   - name: Enable CRB repository
     ansible.builtin.shell:
      cmd: "dnf config-manager --set-enabled crb"

   - name: Install Arrow/Parquet dependencies
     ansible.builtin.dnf:
      name:
       - utf8proc-devel
       - gobject-introspection-devel
      state: present
      enablerepo: crb

   - name: Detect AlmaLinux/Rocky version
     ansible.builtin.shell:
      cmd: "cut -d: -f5 /etc/system-release-cpe | cut -d. -f1"
     register: el_version
     changed_when: false

   - name: Install Apache Arrow repository
     ansible.builtin.dnf:
      name: "https://packages.apache.org/artifactory/arrow/almalinux/{{ el_version.stdout }}/apache-arrow-release-latest.rpm"
      state: present
      disable_gpg_check: true

   - name: Install arrow-devel and parquet-devel
     ansible.builtin.dnf:
      name:
       - arrow-devel
       - parquet-devel
      state: present
      update_cache: true

   - name: Install the PGDG's PostgreSQL Packages and Extra.
     ansible.builtin.dnf:
      name:
       - postgresql16-devel
       - postgresql16-server
       - pg_strom-PG16
      state: present
      update_cache: true
      disable_gpg_check: true

   - name: Init DB
     ansible.builtin.shell:
      cmd: "/usr/pgsql-16/bin/postgresql-16-setup initdb"
      chdir: /var/lib/pgsql/16/data/
      creates: PG_VERSION

   - name: Add include setting
     ansible.builtin.blockinfile:
      path: /var/lib/pgsql/16/data/postgresql.conf
      block: |
        include 'postgresql.custom.conf'
      owner: postgres
      group: postgres
      mode: '0644'
      state: present

   - name: Copy the Postgres setting file
     ansible.builtin.copy:
      src: src/postgresql.custom.conf
      dest: /var/lib/pgsql/16/data/postgresql.custom.conf
      owner: postgres
      group: postgres
      mode: '0644'

   - name: Service Restart
     ansible.builtin.service:
      name: postgresql-16
      state: restarted

   - name: Print message
     ansible.builtin.debug:
      msg: "Setup Successful."

---
- name: Setup PG-Strom for Rocky Linux and AlmaLinux version 8,9,10
  hosts: home
  become: true

  vars:
    # dnf releasever
    el8_releasever: "8"
    el9_releasever: "9"
    el10_releasever: "10"

    # CRB repo name differs on EL8 (powertools) vs EL9/10 (crb)
    el8_crb_repo: "powertools"
    el9_crb_repo: "crb"
    el10_crb_repo: "crb"

    # kernel minimum versions
    el8_kernel_min: "4.18.0-553"
    el9_kernel_min: "5.14.0-611.5"
    el10_kernel_min: "6.12.0-124"

    # CUDA toolkit package
    cuda_toolkit_pkg: "cuda-toolkit-13-1"

    # PostgreSQL / PG-Strom
    pg_version: "17"
    pg_packages:
      - "postgresql17-devel"
      - "postgresql17-server"
    #  - "pg_strom-PG17"
    pg_initdb_cmd: "/usr/pgsql-17/bin/postgresql-17-setup initdb"
    pg_service: "postgresql-17"
    pg_data_dir: "/var/lib/pgsql/17/data"

  tasks:
   - name: Detect OS major version
     ansible.builtin.shell:
      cmd: "cut -d: -f5 /etc/system-release-cpe | cut -d. -f1"
     register: el_version
     changed_when: false
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Set OS version facts
     ansible.builtin.set_fact:
      os_major_version: "{{ el_version.stdout }}"
      is_el8: "{{ el_version.stdout == '8' }}"
      is_el9: "{{ el_version.stdout == '9' }}"
      is_el10: "{{ el_version.stdout == '10' }}"
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Set CRB repo name fact (powertools/crb)
     ansible.builtin.set_fact:
      crb_repo_name: >-
        {{
          (is_el8 | bool) | ternary(el8_crb_repo,
            (is_el9 | bool) | ternary(el9_crb_repo, el10_crb_repo)
          )
        }}
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Display detected OS version
     ansible.builtin.debug:
      msg: "Detected {{ ansible_distribution }} {{ os_major_version }}"
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Upgrade all packages (EL8)
     ansible.builtin.dnf:
      name: "*"
      releasever: "{{ el8_releasever }}"
      state: latest
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - is_el8 | bool

   - name: Upgrade all packages (EL9)
     ansible.builtin.dnf:
      name: "*"
      releasever: "{{ el9_releasever }}"
      state: latest
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - is_el9 | bool

   - name: Upgrade all packages (EL10)
     ansible.builtin.dnf:
      name: "*"
      releasever: "{{ el10_releasever }}"
      state: latest
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - is_el10 | bool

   - name: Reboot after package upgrade
     ansible.builtin.reboot:
      reboot_timeout: 240
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Install the 'Development tools' package group
     ansible.builtin.dnf:
      name: '@Development tools'
      state: present
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Enable CRB repository (EL8/9/10)
     ansible.builtin.shell:
      cmd: "dnf config-manager --set-enabled {{ crb_repo_name }}"
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - crb_repo_name is defined

   - name: Install perl-IPC-Run package from CRB repo
     ansible.builtin.dnf:
      name: perl-IPC-Run
      enablerepo: "{{ crb_repo_name }}"
      state: present
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Install kernel packages (EL8)
     ansible.builtin.dnf:
      name:
       - "kernel >= {{ el8_kernel_min }}"
       - "kernel-core >= {{ el8_kernel_min }}"
       - "kernel-devel >= {{ el8_kernel_min }}"
       - "kernel-headers >= {{ el8_kernel_min }}"
      state: present
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - is_el8 | bool

   - name: Install kernel packages (EL9)
     ansible.builtin.dnf:
      name:
       - "kernel >= {{ el9_kernel_min }}"
       - "kernel-core >= {{ el9_kernel_min }}"
       - "kernel-devel >= {{ el9_kernel_min }}"
       - "kernel-headers >= {{ el9_kernel_min }}"
      state: present
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - is_el9 | bool

   - name: Install kernel packages (EL10)
     ansible.builtin.dnf:
      name:
       - "kernel >= {{ el10_kernel_min }}"
       - "kernel-core >= {{ el10_kernel_min }}"
       - "kernel-devel >= {{ el10_kernel_min }}"
       - "kernel-headers >= {{ el10_kernel_min }}"
      state: present
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - is_el10 | bool

   - name: Install grubby
     ansible.builtin.dnf:
      name: grubby
      state: present
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Configure GRUB for NVIDIA
     ansible.builtin.shell:
      cmd: "grubby --update-kernel=ALL --args='nouveau.modeset=0 rd.driver.blacklist=nouveau video=vesa:off'"
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Install EPEL release
     ansible.builtin.dnf:
      name: epel-release
      state: present
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Install HeteroDB Software Distribution Center rpm
     ansible.builtin.dnf:
      name: "https://heterodb.github.io/swdc/yum/rhel{{ os_major_version }}-noarch/heterodb-swdc-1.3-1.el{{ os_major_version }}.noarch.rpm"
      state: present
      disable_gpg_check: true
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Enable CUDA repository
     ansible.builtin.shell:
      cmd: "dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel{{ os_major_version }}/x86_64/cuda-rhel{{ os_major_version }}.repo"
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Install NVIDIA drivers (EL8/EL9)
     ansible.builtin.shell:
      cmd: "dnf -y module install nvidia-driver:open-dkms"
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - (is_el8 | bool) or (is_el9 | bool)

   - name: Install NVIDIA drivers (EL10)
     ansible.builtin.shell:
      cmd: "dnf -y install nvidia-open"
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - is_el10 | bool

   - name: Install CUDA toolkit
     ansible.builtin.dnf:
      name: "{{ cuda_toolkit_pkg }}"
      state: present
      update_cache: true
      disable_gpg_check: true
     async: 3600
     poll: 30
     register: cuda_install
     retries: 3
     delay: 15
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Check CUDA installation progress
     ansible.builtin.debug:
      var: cuda_install
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Install PostgreSQL package repository
     ansible.builtin.dnf:
      name: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ os_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm"
      state: present
      disable_gpg_check: true
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Disable PostgreSQL module packages
     ansible.builtin.shell:
      cmd: "dnf -y module disable postgresql"
     when:
      - ansible_distribution in ["Rocky", "AlmaLinux"]
      - (is_el8 | bool) or (is_el9 | bool)

   - name: Install Arrow/Parquet dependencies
     ansible.builtin.dnf:
      name:
       - utf8proc-devel
       - gobject-introspection-devel
      state: present
      enablerepo: "{{ crb_repo_name }}"
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Install Apache Arrow repository
     ansible.builtin.dnf:
      name: "https://packages.apache.org/artifactory/arrow/almalinux/{{ os_major_version }}/apache-arrow-release-latest.rpm"
      state: present
      disable_gpg_check: true
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Install arrow-devel and parquet-devel
     ansible.builtin.dnf:
      name:
       - arrow-devel
       - parquet-devel
      state: present
      update_cache: true
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Install PostgreSQL and PG-Strom packages
     ansible.builtin.dnf:
      name: "{{ pg_packages }}"
      state: present
      update_cache: true
      disable_gpg_check: true
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Initialize PostgreSQL database
     ansible.builtin.shell:
      cmd: "{{ pg_initdb_cmd }}"
      chdir: "{{ pg_data_dir }}/"
      creates: PG_VERSION
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Add include setting to postgresql.conf
     ansible.builtin.blockinfile:
      path: "{{ pg_data_dir }}/postgresql.conf"
      block: |
        include 'postgresql.custom.conf'
      owner: postgres
      group: postgres
      mode: '0644'
      state: present
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Copy custom PostgreSQL configuration
     ansible.builtin.copy:
      src: src/postgresql.custom.conf
      dest: "{{ pg_data_dir }}/postgresql.custom.conf"
      owner: postgres
      group: postgres
      mode: '0644'
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Reboot after installation
     ansible.builtin.reboot:
      reboot_timeout: 240
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Start and enable PostgreSQL service
     ansible.builtin.service:
      name: "{{ pg_service }}"
      #state: restarted
      enabled: true
     when: ansible_distribution in ["Rocky", "AlmaLinux"]

   - name: Print success message
     ansible.builtin.debug:
      msg: "Setup successful for {{ ansible_distribution }} {{ os_major_version }}"
     when: ansible_distribution in ["Rocky", "AlmaLinux"]
